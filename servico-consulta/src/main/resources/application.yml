spring:
  application:
    name: feira-consulta

  data:
    mongodb:
      uri: ${MONGO_URI:mongodb://localhost:27017/feira_consulta}
      auto-index-creation: true

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:9092}
    consumer:
      # Grupo proprio: reconstruir a projecao e reposicionar so este grupo,
      # sem tocar nos servicos de negocio.
      group-id: consulta
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer

server:
  port: ${PORT:8084}

management:
  tracing:
    # Desligado por padrao porque exportador sem coletor enche o log de erro
    # de conexao. Ligar exige apontar o endereco, o que evita ligar sem querer.
    enabled: ${RASTRO_ATIVO:false}
    sampling:
      probability: ${RASTRO_AMOSTRAGEM:1.0}
  otlp:
    tracing:
      endpoint: ${RASTRO_ENDERECO:http://localhost:4318/v1/traces}
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true

logging:
  level:
    br.com.feira: ${LOG_LEVEL:INFO}
