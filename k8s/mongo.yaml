# MongoDB do modelo de leitura.
#
# StatefulSet como os outros, mas com uma diferenca que vale registrar: este
# dado e descartavel. Ele e derivado dos eventos, e apagar o volume nao perde
# nada que nao possa ser reconstruido reposicionando o grupo de consumo no
# inicio do topico. Por isso o volume e menor que o dos bancos de negocio.
apiVersion: v1
kind: Service
metadata:
  name: mongo
  namespace: feira
spec:
  clusterIP: None
  selector:
    app: mongo
  ports:
    - port: 27017
      targetPort: 27017
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mongo
  namespace: feira
spec:
  serviceName: mongo
  replicas: 1
  selector:
    matchLabels:
      app: mongo
  template:
    metadata:
      labels:
        app: mongo
    spec:
      containers:
        - name: mongo
          image: mongo:7.0
          ports:
            - containerPort: 27017
          readinessProbe:
            exec:
              command: ["mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
            initialDelaySeconds: 15
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 512Mi
          volumeMounts:
            - name: dados
              mountPath: /data/db
  volumeClaimTemplates:
    - metadata:
        name: dados
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 1Gi
