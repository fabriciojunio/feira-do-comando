# Isolamento de rede do namespace.
#
# Sem NetworkPolicy, qualquer pod de qualquer namespace do cluster alcança o
# banco e o broker daqui. A primeira regra nega toda entrada; a segunda libera
# só o tráfego entre os pods deste namespace, que é o caminho serviço -> banco,
# serviço -> broker e serviço -> serviço. Entrada vinda de fora do cluster, se
# houver, entra por um Ingress com regra própria.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: negar-entrada
  namespace: feira
spec:
  podSelector: {}
  policyTypes: ["Ingress"]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: liberar-dentro-do-namespace
  namespace: feira
spec:
  podSelector: {}
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - podSelector: {}
