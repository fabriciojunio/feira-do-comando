# Os tres servicos.
#
# Duas replicas cada, e isso e possivel por causa do SKIP LOCKED no outbox: as
# instancias disputam a mesma tabela de mensagens sem travar uma na outra e sem
# publicar a mesma mensagem duas vezes.
#
# A imagem aponta para :latest de proposito neste arquivo, que serve de exemplo
# de leitura. Num cluster de verdade a tag e a do commit, senao nao da para
# saber o que esta rodando nem voltar atras.
---
apiVersion: v1
kind: Service
metadata:
  name: servico-pedidos
  namespace: feira
spec:
  selector:
    app: servico-pedidos
  ports:
    - name: http
      port: 80
      targetPort: 8081
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: servico-pedidos
  namespace: feira
  annotations:
    checkov.io/skip1: "CKV_K8S_14=tag latest de proposito: arquivo de leitura; o deploy troca pela tag do commit (ver comentario no topo)"
    checkov.io/skip2: "CKV_K8S_43=mesmo motivo: o digest so existe depois que o pipeline de deploy publica a imagem"
    checkov.io/skip3: "CKV_K8S_11=limite de CPU estrangula a partida da JVM; requests de CPU e limite de memoria estao definidos"
    checkov.io/skip4: "CKV_K8S_35=o Spring le a credencial do banco por variavel de ambiente; arquivo exigiria configtree e mudanca no servico"
  labels:
    app: servico-pedidos
spec:
  replicas: 2
  selector:
    matchLabels:
      app: servico-pedidos
  template:
    metadata:
      labels:
        app: servico-pedidos
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: /actuator/prometheus
        prometheus.io/port: "8081"
    spec:
      # Nenhum servico fala com a API do Kubernetes; sem o token montado, um
      # contêiner comprometido nao tem credencial do cluster para usar.
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: app
          image: ghcr.io/fabriciojunio/feira-servico-pedidos:latest
          env:
            - name: DATABASE_URL
              value: jdbc:postgresql://banco-pedidos:5432/feira_pedidos
            - name: PORT
              value: "8081"
          envFrom:
            - configMapRef:
                name: feira-config
            - secretRef:
                name: feira-banco
          ports:
            - name: http
              containerPort: 8081
          # Tres sondas, cada uma respondendo a uma pergunta diferente.
          # startup: ja terminou de subir? A JVM com Flyway demora, e sem ela
          #   a liveness mataria o pod no meio da migracao.
          # readiness: pode receber trafego agora?
          # liveness: travou de vez e precisa ser reiniciado?
          startupProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            failureThreshold: 30
            periodSeconds: 5
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 20
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        # A raiz e somente leitura, mas a JVM precisa escrever em /tmp.
        - name: tmp
          emptyDir: {}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: servico-pedidos
  namespace: feira
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: servico-pedidos
---
