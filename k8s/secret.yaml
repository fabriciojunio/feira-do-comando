# Modelo. Os valores aqui sao de exemplo e nao servem para nada alem de deixar
# o kustomize resolver a referencia.
#
# Num cluster de verdade isto sai daqui e vem de sealed-secrets, do External
# Secrets Operator ou do cofre do provedor. Credencial commitada fica no
# historico do git para sempre, mesmo depois de removida.
apiVersion: v1
kind: Secret
metadata:
  name: feira-banco
  namespace: feira
type: Opaque
stringData:
  DATABASE_USER: feira
  DATABASE_PASSWORD: troque-antes-de-subir
