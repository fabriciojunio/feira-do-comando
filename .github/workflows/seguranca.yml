name: Segurança

on:
  push:
    branches: ["produção", "homologação"]
  pull_request:
  schedule:
    - cron: "0 6 * * 1"

permissions:
  contents: read

jobs:
  segredos:
    name: Varredura de segredos (gitleaks)
    runs-on: ubuntu-latest
    # Em pull request a action lista os commits do PR pela API; sem esta
    # leitura ela recebe 403 e reprova todo PR, inclusive os do Dependabot.
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # O hook local de commit-msg recusa menção a ferramenta de IA, mas só
      # existe na máquina em que foi instalado. Esta é a mesma regra do lado
      # do servidor, para commit feito em qualquer outra máquina.
      - name: Autoria do histórico
        run: |
          if git log --format=%B | grep -Eiq '^co-authored-by:.*(claude|anthropic)|generated with.*claude'; then
            echo "Commit com coautoria de ferramenta de IA no histórico:"
            git log --format='%h %s' -i --grep='claude' --grep='anthropic'
            exit 1
          fi

  dependencias:
    name: Vulnerabilidades em dependências (osv-scanner)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          java-version: '21'
          distribution: temurin
          cache: maven
      # Lendo os pom.xml direto, o OSV não resolve os módulos internos e desiste
      # da árvore inteira: em 28/10/2026 ele dizia "0 packages" e passava verde
      # com quinze bibliotecas vulneráveis. O SBOM sai do próprio Maven, com as
      # transitivas que vão de fato para o jar.
      - name: Gerar o SBOM do back-end
        run: mvn -B -q org.cyclonedx:cyclonedx-maven-plugin:2.9.3:makeAggregateBom -DoutputFormat=json -DoutputName=bom.cdx
      - uses: google/osv-scanner-action/osv-scanner-action@b1d267aea5211fa648d9d442fa64b90dbdcbdd36 # v2.7.0
        with:
          scan-args: |-
            --config=osv-scanner.toml
            -L target/bom.cdx.json
            -L web/package-lock.json

  sbom:
    name: SBOM (SPDX e CycloneDX) e Grype
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          java-version: '21'
          distribution: temurin
          cache: maven
      # O conversor decide o que o Grype ignora; se ele errar, o Grype cala uma
      # falha que o OSV não aceitou.
      - name: Testar o conversor de aceites
        run: python3 -m unittest scripts/test_aceites_para_grype.py -v
      # O SBOM sai dos jars de verdade, com as transitivas que vão para a imagem.
      - name: Empacotar os serviços
        run: mvn -B -q package -DskipTests
      - name: Instalar syft e grype com hash conferido
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          baixar() {
            curl -fsSL -o pacote.tar.gz "$1"
            echo "$2  pacote.tar.gz" | sha256sum -c -
            tar -xzf pacote.tar.gz "$3"
          }
          baixar https://github.com/anchore/syft/releases/download/v1.55.0/syft_1.55.0_linux_amd64.tar.gz \
            bb65249542db5fedeeb4d3f9b018b75e7264dbfbbb10486f044581a92f90490d syft
          baixar https://github.com/anchore/grype/releases/download/v0.121.0/grype_0.121.0_linux_amd64.tar.gz \
            64e07133d3486115de647a66581461dccf5c732748a0a3119077395565f15519 grype
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - name: Gerar o SBOM em SPDX e em CycloneDX
        run: |
          syft scan dir:. --exclude './**/node_modules/**' -q \
            -o spdx-json=sbom.spdx.json -o cyclonedx-json=sbom.cdx.json
      # Uma fonte de aceites só: a falha aceita no osv-scanner.toml, com motivo e
      # prazo, é a que o Grype ignora. Aceite vencido volta a reprovar nos dois.
      - name: Grype contra o SBOM, com os aceites do OSV
        run: |
          python3 scripts/aceites_para_grype.py osv-scanner.toml .grype-ci.yaml
          grype sbom:sbom.cdx.json -c .grype-ci.yaml --fail-on high
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: sbom
          path: |
            sbom.spdx.json
            sbom.cdx.json
          retention-days: 90

  deteccao:
    name: Detecção como código (Sigma e Falco)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Cada regra Sigma vira SQL e roda contra logs no formato exato dos
      # serviços: o teste prova que ela pega o que deve e não pega o ruído.
      - name: Testar as regras Sigma
        run: |
          python3 -m venv "$RUNNER_TEMP/sigma"
          "$RUNNER_TEMP/sigma/bin/pip" install --quiet --require-hashes -r deteccao/requisitos.txt
          "$RUNNER_TEMP/sigma/bin/python" -m unittest deteccao/test_regras_sigma.py -v
      # O Falco carrega as regras junto com o conjunto padrão, de onde vêm as
      # macros, e recusa campo, macro ou lista que não existam.
      - name: Validar as regras do Falco
        run: |
          docker run --rm -v "$PWD/deteccao/falco:/regras:ro"             falcosecurity/falco:0.45.1@sha256:69e957f91b3a6beb5c82e2afae33ec3e4479dab2d4421475d288d0cd113cedf6             falco -V /etc/falco/falco_rules.yaml -V /regras/regras-feira.yaml

  semgrep:
    name: Análise estática (Semgrep, regras próprias)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # As regras próprias têm teste: cada uma prova o que pega e o que não pega
      # (docs/seguranca/semgrep.md). Regra sem teste quebra em silêncio.
      - name: Testar as regras próprias
        run: pipx run --spec semgrep==1.181.0 semgrep --test --metrics=off --config .semgrep/regras .semgrep/testes
      - name: Varrer com os conjuntos públicos e as regras próprias
        run: |
          pipx run --spec semgrep==1.181.0 semgrep scan --metrics=off --error \
            --config p/java --config p/owasp-top-ten --config p/secrets --config p/security-audit \
            --config .semgrep/regras \
            --exclude .semgrep --exclude target --exclude node_modules --exclude web .

  codeql:
    name: Análise estática (CodeQL, ${{ matrix.linguagem }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        linguagem: [java-kotlin, javascript-typescript]
    permissions:
      security-events: write
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          languages: ${{ matrix.linguagem }}
          # Java sem compilar: o CodeQL lê o código-fonte direto, e o CI já
          # prova que ele compila. Evita repetir aqui os minutos do Maven.
          build-mode: none
          queries: security-extended
      - uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          category: ${{ matrix.linguagem }}
          output: sarif-results
      # Falha em qualquer achado que não esteja no registro de aceites, e também em aceite
      # vencido: um risco aceito volta a barrar quando chega a data de revisão.
      - name: Falha se o CodeQL encontrou algum problema não aceito
        run: |
          # Qualquer erro aqui (jq ausente, SARIF inválido) reprova: a barreira nunca passa por falha.
          set -euo pipefail
          today=$(date -u +%F)
          expired=$(jq -r --arg today "$today" '.[] | select(.review < $today) | "\(.rule) em \(.path) venceu em \(.review)"' .github/codeql-accepted.json)
          if [ -n "$expired" ]; then echo "Aceite vencido, reavaliar:"; echo "$expired"; exit 1; fi
          jq -r '.runs[].results[] | "\(.ruleId)|\(.locations[0].physicalLocation.artifactLocation.uri)|\(.locations[0].physicalLocation.region.startLine)"' sarif-results/*.sarif > findings.txt
          jq -r '.[] | "\(.rule)|\(.path)"' .github/codeql-accepted.json > accepted.txt
          open=$(while IFS='|' read -r rule path line; do grep -qxF "$rule|$path" accepted.txt || echo "$rule: $path:$line"; done < findings.txt)
          echo "CodeQL: $(wc -l < findings.txt) resultado(s), $(echo -n "$open" | grep -c . || true) sem aceite"
          if [ -n "$open" ]; then echo "$open"; exit 1; fi
