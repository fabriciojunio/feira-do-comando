name: CI

on:
  push:
    branches: ["produção", "homologação"]
  pull_request:
    branches: ["produção", "homologação"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Nenhum passo daqui escreve no repositório.
permissions:
  contents: read

jobs:
  build:
    name: Build e testes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Instalar Java 21
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # A suite inteira roda aqui, inclusive os testes que sobem PostgreSQL e
      # Kafka. Nenhum precisa de Docker: o Postgres e embutido e o broker vem
      # do spring-kafka-test. Separar isso num job opcional significaria que o
      # unico teste capaz de provar a saga so roda quando alguem lembra.
      - name: Testes
        run: mvn -B verify

      - name: Guardar relatorios
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: relatorios-de-teste
          path: '**/target/surefire-reports/'
          retention-days: 7

  web:
    name: Web
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  imagens:
    name: Imagens Docker
    runs-on: ubuntu-latest
    strategy:
      matrix:
        modulo: [servico-pedidos, servico-estoque, servico-pagamentos, servico-consulta]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Construir ${{ matrix.modulo }}
        run: docker build --build-arg MODULO=${{ matrix.modulo }} -t feira/${{ matrix.modulo }}:ci .

  manifestos:
    name: Manifestos Kubernetes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Sem cluster nenhum: o kubeconform confere os manifestos contra os
      # esquemas da API do Kubernetes. Pega apiVersion errada, campo com nome
      # trocado e tipo incompativel, que e exatamente o erro que so aparece na
      # hora do apply. Nao diz nada sobre o manifesto estar certo para a carga
      # real, e o README do diretorio deixa isso claro.
      - name: Instalar kubeconform
        run: |
          curl -sSL -o kubeconform.tar.gz             https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz
          # Binário baixado da internet só roda se for o que o autor publicou.
          echo "95f14e87aa28c09d5941f11bd024c1d02fdc0303ccaa23f61cef67bc92619d73  kubeconform.tar.gz" | sha256sum -c -
          tar xzf kubeconform.tar.gz kubeconform
          sudo mv kubeconform /usr/local/bin/

      # Cada política tem caso que passa e caso que reprova (k8s/politicas/testes).
      # Política sem teste quebra em silêncio, igual regra de Semgrep.
      - name: Testar as políticas do Kyverno
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          curl -fsSL -o kyverno.tar.gz https://github.com/kyverno/kyverno/releases/download/v1.19.2/kyverno-cli_v1.19.2_linux_x86_64.tar.gz
          echo "357eaf1df8bc24ddd5a73979fadeaae6a032e8710f11af264229756e4956bf4a  kyverno.tar.gz" | sha256sum -c -
          tar -xzf kyverno.tar.gz kyverno
          cd "$GITHUB_WORKSPACE"
          "$RUNNER_TEMP/kyverno" test k8s/politicas/testes

      # O kustomization.yaml fica de fora porque nao e recurso da API do
      # Kubernetes: e configuracao da ferramenta, e o kubeconform corretamente
      # nao tem esquema para ele. Validar a saida renderizada do kustomize
      # exigiria instalar mais uma ferramenta para cobrir uma lista de arquivos
      # que o proprio job ja percorre.
      - name: Validar
        run: |
          kubeconform -strict -summary             -kubernetes-version 1.30.0             -schema-location default             -ignore-filename-pattern 'kustomization.yaml'             k8s/*.yaml

  iac:
    name: Infraestrutura como código (Checkov)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Terraform, manifestos e Dockerfile. Aceite tem que estar escrito no
      # próprio arquivo, com o motivo (#checkov:skip ou anotação
      # checkov.io/skip); qualquer achado sem aceite reprova.
      - name: Rodar o Checkov
        run: |
          pipx run --spec checkov==3.3.29 checkov --quiet --compact             -d infra --framework terraform
          # k8s/politicas/testes guarda pods ruins de propósito: são os casos que o
          # Kyverno tem de recusar, e o teste dele prova que recusa.
          pipx run --spec checkov==3.3.29 checkov --quiet --compact             -d k8s --framework kubernetes --skip-path k8s/politicas/testes
          pipx run --spec checkov==3.3.29 checkov --quiet --compact             -f Dockerfile --framework dockerfile

  terraform:
    name: Infraestrutura
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.9.8
          # O wrapper acrescenta texto à saída e quebraria o "terraform output -json"
          # que o teste do módulo de estado lê.
          terraform_wrapper: false

      - name: Formatacao
        run: terraform fmt -check -recursive infra

      # init sem backend e validate nao precisam de credencial da AWS: eles
      # conferem sintaxe, referencia entre recursos e tipo de atributo. O que
      # nao cobrem e se o recurso existe de fato na conta, e isso so o plan
      # com credencial diria.
      - name: Validar
        working-directory: infra
        run: |
          terraform init -backend=false -input=false
          terraform validate

      # validate não diz se o código faz o que promete. O módulo do estado é
      # aplicado de verdade no moto, emulador aberto da AWS, e cada controle
      # (versionamento, KMS, bloqueio público, TLS, rotação, trava) é conferido
      # pela API. Custo zero, e nada sai da máquina do runner.
      - name: Aplicar o módulo de estado num emulador e conferir os controles
        run: |
          python3 -m venv "$RUNNER_TEMP/moto"
          "$RUNNER_TEMP/moto/bin/pip" install --quiet --require-hashes -r infra/estado/requisitos.txt
          "$RUNNER_TEMP/moto/bin/python" infra/estado/testar_no_emulador.py

  cluster:
    name: Kubernetes num cluster de verdade
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Um cluster kind de verdade, e nao so validacao de esquema. A diferenca
      # importa: kubeconform diz que o YAML esta bem formado, e este job diz
      # que o Kubernetes aceita o manifesto e agenda os pods. Sonda mal escrita
      # e limite de recurso impossivel so aparecem aqui.
      - uses: helm/kind-action@1544676c07bb3570fcb70166beaa07c4528fd4aa # v1.15.1
        with:
          cluster_name: feira
          wait: 120s

      - name: Instalar o Kyverno
        run: |
          helm repo add kyverno https://kyverno.github.io/kyverno/
          helm install kyverno kyverno/kyverno --version 3.9.2 -n kyverno --create-namespace --wait --timeout 5m

      - name: Aplicar as políticas de admissão
        run: |
          kubectl apply -f k8s/namespace.yaml
          # O helm --wait volta com os pods prontos, mas o webhook que valida as
          # próprias políticas ainda pode estar subindo: tenta de novo até ele
          # responder, em vez de depender da sorte do tempo.
          for tentativa in $(seq 1 36); do
            kubectl apply -k k8s/politicas/ && break
            [ "$tentativa" = 36 ] && { echo "::error::O Kyverno não aceitou as políticas em 3 minutos."; exit 1; }
            sleep 5
          done
          # Pronta é quando o servidor de API passa a recusar citando a política:
          # até o webhook ser registrado, o pod privilegiado ainda seria aceito.
          # Recusa por outro motivo (namespace inexistente, por exemplo) não conta.
          for tentativa in $(seq 1 36); do
            resposta=$(kubectl apply --dry-run=server -f - 2>&1 <<'POD' || true
          apiVersion: v1
          kind: Pod
          metadata: {name: sonda-de-admissao, namespace: feira}
          spec:
            containers: [{name: c, image: postgres:16-alpine, securityContext: {privileged: true}}]
          POD
            )
            if echo "$resposta" | grep -q "sem-privilegio"; then
              echo "Admissão ativa na tentativa $tentativa: $resposta"; exit 0
            fi
            sleep 5
          done
          echo "::error::As políticas não passaram a valer em 3 minutos."; exit 1

      # A base usa :latest como exemplo de leitura; o cluster recebe o overlay
      # com tag fixa, que é o que a política de imagem confiável aceita.
      - name: Aplicar os manifestos
        run: kubectl apply -k overlays/ci/

      # Dry-run no servidor passa pela admissão de verdade, sem criar nada.
      # Cada pod ruim tem de ser recusado; o correto, aceito.
      - name: Provar que a admissão barra o que deve
        run: |
          set -uo pipefail
          aceito=$(kubectl apply --dry-run=server -f k8s/politicas/testes/recursos.yaml 2>&1 || true)
          echo "$aceito"
          falhas=0
          for ruim in rede-do-host privilegiado sem-seccomp sem-limite registro-estranho tag-latest sem-tag servico-como-root; do
            if echo "$aceito" | grep -q "pod/$ruim created"; then echo "::error::$ruim passou pela admissão"; falhas=1; fi
          done
          for bom in servico-correto digest-fixo; do
            echo "$aceito" | grep -q "pod/$bom created" || { echo "::error::$bom foi recusado"; falhas=1; }
          done
          exit $falhas

      - name: Esperar bancos e broker
        run: |
          kubectl -n feira rollout status statefulset/broker --timeout=300s
          for banco in pedidos estoque pagamentos; do
            kubectl -n feira rollout status statefulset/banco-$banco --timeout=300s
          done

      # Os Deployments dos servicos apontam para imagens em ghcr que este job
      # nao publica, entao eles nao sobem aqui. O que se verifica e que o
      # Kubernetes aceitou os objetos e agendou os pods: erro de sonda, de
      # seletor ou de volume aparece neste ponto.
      - name: Conferir que os objetos existem e foram agendados
        run: |
          kubectl -n feira get all
          for s in pedidos estoque pagamentos; do
            kubectl -n feira get deploy/servico-$s -o wide
            kubectl -n feira get pdb/servico-$s
          done

      - name: Diagnostico quando algo falha
        if: failure()
        run: |
          kubectl -n feira get events --sort-by=.lastTimestamp | tail -40
          kubectl -n feira describe pods | tail -80

  carga:
    name: Carga
    runs-on: ubuntu-latest
    needs: build
    # So no push para a branch principal. Levanta o sistema inteiro e leva uns
    # minutos; rodar em cada pull request atrasaria o retorno sem pegar nada
    # que os testes de vazao do build ja nao peguem.
    if: github.event_name == 'push' && github.ref == 'refs/heads/produção'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Subir o sistema
        run: docker compose up -d --wait --wait-timeout 300

      # Binario direto, e nao o repositorio apt. O caminho pelo apt exige
      # importar a chave com gpg --recv-keys, e o runner nao tem dirmngr:
      # falha com "No dirmngr" antes de instalar qualquer coisa.
      - name: Instalar k6
        env:
          K6_VERSAO: v2.2.0
        run: |
          curl -sSL "https://github.com/grafana/k6/releases/download/${K6_VERSAO}/k6-${K6_VERSAO}-linux-amd64.tar.gz" -o /tmp/k6.tar.gz
          tar xzf /tmp/k6.tar.gz -C /tmp --strip-components 1 "k6-${K6_VERSAO}-linux-amd64/k6"
          sudo mv /tmp/k6 /usr/local/bin/k6
          k6 version

      - name: Rodar a carga
        run: k6 run -e BASE=http://localhost:8081 -e ESTOQUE=http://localhost:8082 carga/pedidos.js

      - name: Guardar o resultado
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: resultado-da-carga
          path: carga/resultado.json

      - name: Log dos servicos quando falha
        if: failure()
        run: docker compose logs --tail 200
