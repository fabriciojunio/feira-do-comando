version: 2
updates:
  # Versão nova só é proposta depois de 7 dias, quando um pacote comprometido
  # costuma já ter sido retirado do repositório público.
  - package-ecosystem: "maven"
    directory: "/"
    schedule:
      interval: "weekly"
    # Menor e correção vão num PR só por ecossistema. Um PR por pacote estourou
    # o limite diário de deploys da Vercel em 05/11/2026.
    groups:
      menores-e-correcoes:
        update-types: ["minor", "patch"]
    cooldown:
      default-days: 7
    commit-message:
      prefix: "build(deps)"
